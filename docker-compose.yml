version: '3.8'

services:
  backend:
    build: "."
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploaded_pdfs:/app/uploaded_pdfs
      - ./chroma_db:/app/chroma_db
    depends_on:
      - db
  
  frontend:
    build: "./frontend"
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:    

      